name: CI BelleAgenda

on:
  push:
    branches:
      - main
      - review/mvp-tecnica
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: belleagenda
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d belleagenda"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install django python-dotenv psycopg2-binary coverage

      - name: Configurar banco de dados
        env:
          DB_NAME: belleagenda
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: echo "Banco PostgreSQL configurado para os testes."

      - name: Executar testes
        env:
          DB_NAME: belleagenda
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: python manage.py test