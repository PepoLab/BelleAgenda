{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BelleAgenda{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'agenda/css/style.css' %}"
    >
</head>

<body class="bg-light">

    <header class="bg-dark text-white">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">

                <a class="navbar-brand fw-bold" href="{% url 'agenda_home' %}">
                    BelleAgenda
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menu"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'agenda_home' %}">
                                Agenda
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'client_list' %}">
                                Clientes
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"  href="{% url 'service_list' %}">
                                Serviços
                            </a>
                        </li>

                    </ul>

                    <div class="d-flex align-items-center gap-3">
                        <span class="text-white">
                            Olá, {{ user.username }}
                        </span>

                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}

                            <button
                                type="submit"
                                class="btn btn-outline-light btn-sm"
                            >
                                Sair
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </nav>
    </header>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>
</html>
