<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BelleAgenda</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <main class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <h1 class="fw-bold">
                                BelleAgenda
                            </h1>

                            <p class="text-muted mb-0">
                                Acesse sua agenda
                            </p>

                        </div>

                        {% if form.errors %}
                            <div
                                class="alert alert-danger"
                                role="alert"
                            >
                                Usuário ou senha inválidos.
                            </div>
                        {% endif %}

                        <form method="post">

                            {% csrf_token %}

                            <div class="mb-3">

                                <label
                                    for="id_username"
                                    class="form-label"
                                >
                                    Usuário
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    id="id_username"
                                    class="form-control"
                                    autocomplete="username"
                                    required
                                    autofocus
                                >

                            </div>

                            <div class="mb-4">

                                <label
                                    for="id_password"
                                    class="form-label"
                                >
                                    Senha
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    id="id_password"
                                    class="form-control"
                                    autocomplete="current-password"
                                    required
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Entrar
                            </button>

                        </form>

                    </div>

                </div>

                <p class="text-center text-muted small mt-4">
                    BelleAgenda &copy; 2026
                </p>

            </div>

        </div>

    </main>

</body>

</html>
