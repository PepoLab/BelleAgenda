<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BelleAgenda</title>
</head>
<body>

    <main>
        <h1>BelleAgenda</h1>

        <p>Entre na sua conta para acessar sua agenda.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Entrar
            </button>
        </form>
    </main>

</body>
</html>
